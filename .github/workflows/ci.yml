name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install lightweight CPU-only PyTorch wheel to keep CI fast
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt semgrep httpx

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Run Semgrep Static Security Audit
        run: |
          semgrep --config=auto src/ --quiet || true
